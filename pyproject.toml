[project]
name = "kelly"
version = "0.0.1"
description = "Kelly: an LLM research agent for futures markets (learning project)"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "yfinance>=0.2.40",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kelly*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
